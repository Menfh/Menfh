
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070405">
  <title>MENFH | Redes Sociales</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #070405;
      background-image:
        linear-gradient(
          rgba(5, 2, 3, 0.08),
          rgba(5, 2, 3, 0.15)
        ),
        url("fondo-menfh.png.png");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .spark {
      position: absolute;
      display: block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffb75e;
      box-shadow:
        0 0 12px #ff9b38,
        0 0 25px rgba(255, 58, 32, 0.6);
      opacity: 0;
      animation: sparkFloat 8s linear infinite;
    }

    .s1 { left: 12%; bottom: -10px; animation-delay: 0s; }
    .s2 { left: 35%; bottom: -10px; animation-delay: 2s; }
    .s3 { left: 70%; bottom: -10px; animation-delay: 4s; }
    .s4 { left: 88%; bottom: -10px; animation-delay: 6s; }

    @keyframes sparkFloat {
      0% {
        transform: translateY(0) scale(0.5);
        opacity: 0;
      }
      15% { opacity: 0.8; }
      75% { opacity: 0.5; }
      100% {
        transform: translateY(-110vh) scale(1.2);
        opacity: 0;
      }
    }

    main {
      position: relative;
      z-index: 2;
      width: min(620px, 92vw);
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    .hero {
      text-align: center;
    }

    .avatar {
      display: block;
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      margin: 0 auto 18px;
      border: 3px solid #d6a653;
      box-shadow:
        0 0 0 5px rgba(18, 5, 5, 0.8),
        0 0 28px rgba(255, 65, 25, 0.35),
        0 0 45px rgba(214, 166, 83, 0.18);
      animation: dragonFloat 4.8s ease-in-out infinite;
    }

    @keyframes dragonFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 4px;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.9);
    }

    h1 span {
      color: #ff3048;
    }

    .tag {
      margin: 10px 0 0;
      color: #d8d0d0;
      font-size: 12px;
      letter-spacing: 3px;
      text-shadow: 0 2px 8px #000;
    }

    .rule {
      height: 2px;
      width: 78%;
      margin: 30px auto 26px;
      background: linear-gradient(
        90deg,
        transparent,
        #d8a74b,
        #f23545,
        #d8a74b,
        transparent
      );
      box-shadow: 0 0 12px rgba(255, 50, 50, 0.35);
    }

    .links {
      display: grid;
      gap: 16px;
    }

    .social {
      display: block;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(224, 168, 83, 0.8);
      border-radius: 18px;
      background: #0c0508;
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.65),
        0 0 18px rgba(180, 26, 30, 0.16);
      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .social img {
      display: block;
      width: 100%;
      height: auto;
    }

    .social::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -85%;
      width: 45%;
      height: 200%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.13),
        transparent
      );
      transform: rotate(20deg);
      transition: left 0.65s ease;
      pointer-events: none;
    }

    .social:hover {
      transform: translateY(-4px) scale(1.015);
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.75),
        0 0 22px rgba(240, 45, 48, 0.3);
    }

    .social:hover::after {
      left: 145%;
    }

    .social:focus-visible {
      outline: 3px solid #ffce70;
      outline-offset: 4px;
    }

    @media (max-width: 560px) {
      body {
        background-attachment: scroll;
      }

      main {
        padding: 36px 0 55px;
      }

      .avatar {
        width: 150px;
        height: 150px;
      }

      h1 {
        font-size: 34px;
      }

      .tag {
        font-size: 11px;
        letter-spacing: 2px;
      }

      .links {
        gap: 12px;
      }

      .social {
        border-radius: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="bg" aria-hidden="true">
    <i class="spark s1"></i>
    <i class="spark s2"></i>
    <i class="spark s3"></i>
    <i class="spark s4"></i>
  </div>

  <main>
    <header class="hero">
      <img
        class="avatar"
        src="avatar-menfh.jpg"
        alt="Avatar Menfh"
      >

      <h1>MEN<span>FH</span></h1>

      <p class="tag">
        STREAMS · GAMING · COMUNIDAD
      </p>
    </header>

    <div class="rule"></div>

    <section class="links" aria-label="Redes sociales">

      <a
        class="social"
        href="https://www.twitch.tv/imenfh"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visitar Twitch de iMenfh"
      >
        <img
          src="Twitch Sniper Neon Banner.png"
          alt="Twitch de iMenfh"
        >
      </a>

      <a
        class="social"
        href="https://www.tiktok.com/@_menfh"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visitar TikTok de Menfh"
      >
        <img
          src="tiktok.jpg"
          alt="TikTok de Menfh"
        >
      </a>

      <a
        class="social"
        href="https://www.instagram.com/maxiavancini/?hl=es-la"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visitar Instagram de Menfh"
      >
        <img
          src="instagram.jpg"
          alt="Instagram de Menfh"
        >
      </a>

    </section>
  </main>

</body>
</html>
