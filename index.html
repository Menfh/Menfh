<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090608">

<title>Menfh | Redes</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

:root{
  --red:#ff234b;
  --gold:#e7b657;
  --cream:#f5eee5;
  --muted:#aaa0a2;
}

/* =========================
   FONDO
========================= */

body{
  margin:0;
  min-height:100vh;

  color:var(--cream);

  font-family:
    Inter,
    Segoe UI,
    Arial,
    sans-serif;

  background-color:#070405;

  background-image:
    linear-gradient(
      rgba(5,2,3,.08),
      rgba(5,2,3,.15)
    ),
    url("fondo-menfh.png");

  background-position:center center;
  background-size:cover;
  background-repeat:no-repeat;
  background-attachment:fixed;

  overflow-x:hidden;
}


/* Capa de partículas */

.bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}


/* =========================
   PARTÍCULAS
========================= */

.spark{
  position:absolute;

  width:5px;
  height:5px;

  transform:rotate(45deg);

  animation:
    sparkFloat 7s
    ease-in-out
    infinite;
}


.s1{
  left:7%;
  top:18%;

  background:#ff294f;

  box-shadow:
    0 0 8px #ff294f,
    0 0 16px rgba(255,41,79,.7);
}


.s2{
  right:8%;
  top:34%;

  background:#e7b657;

  box-shadow:
    0 0 8px #e7b657,
    0 0 16px rgba(231,182,87,.7);

  animation-delay:-2s;
}


.s3{
  left:13%;
  top:72%;

  background:#ff294f;

  box-shadow:
    0 0 8px #ff294f,
    0 0 16px rgba(255,41,79,.7);

  animation-delay:-4s;
}


.s4{
  right:10%;
  top:82%;

  background:#e7b657;

  box-shadow:
    0 0 8px #e7b657,
    0 0 16px rgba(231,182,87,.7);

  animation-delay:-1s;
}


@keyframes sparkFloat{

  0%,100%{
    transform:
      translateY(0)
      rotate(45deg);

    opacity:.85;
  }

  50%{
    transform:
      translateY(-22px)
      rotate(135deg);

    opacity:.35;
  }

}


/* =========================
   CONTENIDO
========================= */

main{
  width:min(620px,92vw);

  margin:auto;

  padding:
    48px 0
    72px;

  position:relative;

  z-index:2;
}


/* =========================
   CABECERA
========================= */

.hero{
  text-align:center;

  animation:
    enter .7s
    ease both;
}


/* =========================
   AVATAR
========================= */

.avatar{
  width:180px;
  height:180px;

  border-radius:50%;

  object-fit:cover;

  border:
    2px solid
    var(--gold);

  box-shadow:
    0 0 0 5px
    rgba(255,35,75,.08),

    0 0 42px
    rgba(255,35,75,.24);

  animation:
    dragonFloat
    4.8s
    ease-in-out
    infinite;

  transition:.25s;
}


.avatar:hover{

  animation-play-state:paused;

  transform:
    scale(1.035)
    rotate(-1deg);

  box-shadow:
    0 0 0 5px
    rgba(231,182,87,.10),

    0 0 48px
    rgba(255,35,75,.34);
}


@keyframes dragonFloat{

  0%,100%{
    transform:
      translateY(0)
      rotate(0deg);
  }

  50%{
    transform:
      translateY(-7px)
      rotate(.4deg);
  }

}


/* =========================
   MENFH
========================= */

h1{

  font-family:
    Georgia,
    serif;

  font-size:42px;

  letter-spacing:6px;

  margin:
    17px 0
    5px;

  text-shadow:
    0 3px 15px
    rgba(0,0,0,.75);
}


h1 span{
  color:var(--red);
}


.tag{

  margin:0;

  color:#c0b5b7;

  font-size:13px;

  letter-spacing:2.1px;

  text-shadow:
    0 2px 10px
    #000;
}


/* Línea dorada */

.rule{

  height:1px;

  margin:
    28px auto
    30px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--gold),
      var(--red),
      var(--gold),
      transparent
    );

  box-shadow:
    0 0 8px
    rgba(255,35,75,.25);
}


/* =========================
   BOTONES
========================= */

.links{

  display:grid;

  gap:16px;
}


.social{

  display:block;

  position:relative;

  border-radius:19px;

  overflow:hidden;

  border:
    1px solid
    rgba(231,182,87,.7);

  box-shadow:
    0 12px 30px
    rgba(0,0,0,.55);

  transition:.25s;

  animation:
    enter .65s
    ease both;
}


.social:nth-child(2){
  animation-delay:.08s;
}


.social:nth-child(3){
  animation-delay:.16s;
}


.social img{

  display:block;

  width:100%;

  height:auto;

  transition:.35s;
}


/* Brillo al pasar mouse */

.social::after{

  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      105deg,
      transparent 45%,
      rgba(255,255,255,.12) 52%,
      transparent 59%
    );

  transform:
    translateX(-120%);

  transition:.55s;
}


.social:hover{

  transform:
    translateY(-4px)
    scale(1.008);

  border-color:#ffd982;

  box-shadow:
    0 16px 38px
    rgba(0,0,0,.55),

    0 0 22px
    rgba(255,35,75,.16);
}


.social:hover img{
  transform:scale(1.012);
}


.social:hover::after{
  transform:translateX(120%);
}


/* =========================
   ENTRADA
========================= */

@keyframes enter{

  from{
    opacity:0;

    transform:
      translateY(14px);
  }

  to{
    opacity:1;

    transform:none;
  }

}


/* =========================
   MOBILE
========================= */

@media(max-width:560px){

  body{
    background-attachment:scroll;
    background-position:center top;
  }

  main{
    padding-top:32px;
  }

  .avatar{
    width:150px;
    height:150px;
  }

  h1{
    font-size:34px;
  }

  .tag{
    font-size:11px;
  }

  .links{
    gap:12px;
  }

  .social{
    border-radius:14px;
  }

}


/* Accesibilidad */

@media(prefers-reduced-motion:reduce){

  .avatar,
  .spark,
  .social,
  .hero{
    animation:none !important;
  }

}

</style>
</head>


<body>


<!-- PARTÍCULAS -->

<div class="bg">

  <i class="spark s1"></i>
  <i class="spark s2"></i>
  <i class="spark s3"></i>
  <i class="spark s4"></i>

</div>


<!-- CONTENIDO -->

<main>


<header class="hero">


<img
  class="avatar"
  src="avatar-menfh.jpg"
  alt="Avatar Menfh"
>


<h1>
  MEN<span>FH</span>
</h1>


<p class="tag">
  STREAMS · GAMING · COMUNIDAD
</p>


</header>


<div class="rule"></div>


<section class="links">


<a
  class="social"
  href="https://www.twitch.tv/menfojitofan"
  target="_blank"
  rel="noopener noreferrer"
>

  <img
    src="twitch.jpg"
    alt="Twitch de Menfh"
  >

</a>


<a
  class="social"
  href="https://www.tiktok.com/@_menfh"
  target="_blank"
  rel="noopener noreferrer"
>

  <img
    src="tiktok.jpg"
    alt="TikTok de Menfh"
  >

</a>


<a
  class="social"
  href="https://www.instagram.com/maxiavancini/?hl=es-la"
  target="_blank"
  rel="noopener noreferrer"
>

  <img
    src="instagram.jpg"
    alt="Instagram de Menfh"
  >

</a>


</section>


</main>


</body>
</html>
