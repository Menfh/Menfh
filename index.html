<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090608">
<title>Menfh | Redes</title>
<style>
*{box-sizing:border-box} html{scroll-behavior:smooth}
:root{--red:#ff234b;--gold:#e7b657;--cream:#f5eee5;--muted:#aaa0a2}
body{margin:0;min-height:100vh;color:var(--cream);font-family:Inter,Segoe UI,Arial,sans-serif;
background:
radial-gradient(circle at 50% -10%,rgba(151,17,42,.34),transparent 38%),
radial-gradient(circle at 8% 55%,rgba(255,35,75,.07),transparent 25%),
linear-gradient(180deg,#090608,#0b0709 50%,#050405);overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.grid{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(rgba(231,182,87,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(231,182,87,.09) 1px,transparent 1px);background-size:55px 55px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}
.spark{position:absolute;width:5px;height:5px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 10px var(--gold);animation:float 7s ease-in-out infinite}
.s1{left:11%;top:18%}.s2{right:13%;top:35%;animation-delay:-2s}.s3{left:20%;top:73%;animation-delay:-4s}.s4{right:21%;top:82%;animation-delay:-1s}
@keyframes float{50%{transform:translateY(-20px) rotate(135deg);opacity:.35}}
main{width:min(620px,92vw);margin:auto;padding:48px 0 72px;position:relative;z-index:1}
.hero{text-align:center;animation:enter .7s ease both}
.avatar{width:150px;height:150px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 0 0 5px rgba(255,35,75,.08),0 0 42px rgba(255,35,75,.24);transition:.25s}
.avatar:hover{transform:scale(1.035) rotate(-1deg);box-shadow:0 0 0 5px rgba(231,182,87,.10),0 0 48px rgba(255,35,75,.34)}
h1{font-family:Georgia,serif;font-size:42px;letter-spacing:6px;margin:17px 0 5px}h1 span{color:var(--red)}
.tag{margin:0;color:var(--muted);font-size:13px;letter-spacing:2.1px}
.rule{height:1px;margin:28px auto 30px;background:linear-gradient(90deg,transparent,var(--gold),var(--red),var(--gold),transparent)}
.section-title{font-size:11px;color:var(--gold);letter-spacing:2.6px;text-transform:uppercase;margin:0 0 11px 6px}
.links{display:grid;gap:16px}.social{display:block;position:relative;border-radius:19px;overflow:hidden;border:1px solid rgba(231,182,87,.7);box-shadow:0 12px 30px rgba(0,0,0,.32);transition:.25s;animation:enter .65s ease both}
.social:nth-child(2){animation-delay:.08s}.social:nth-child(3){animation-delay:.16s}
.social img{display:block;width:100%;height:auto;transition:.35s}
.social:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 45%,rgba(255,255,255,.10) 52%,transparent 59%);transform:translateX(-120%);transition:.55s}
.social:hover{transform:translateY(-4px) scale(1.008);border-color:#ffd982;box-shadow:0 16px 38px rgba(0,0,0,.42),0 0 20px rgba(255,35,75,.12)}
.social:hover img{transform:scale(1.012)}.social:hover:after{transform:translateX(120%)}
.hint{text-align:center;color:#766d70;font-size:11px;letter-spacing:1.4px;margin-top:24px}
footer{text-align:center;color:#5e575a;font-size:10px;letter-spacing:2.5px;margin-top:38px}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:560px){main{padding-top:32px}.avatar{width:126px;height:126px}h1{font-size:34px}.tag{font-size:11px}.links{gap:12px}.social{border-radius:14px}}
</style>
</head>
<body>
<div class="bg"><div class="grid"></div><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i></div>
<main>
<header class="hero">
<img class="avatar" src="avatar-menfh.jpg" alt="Avatar Menfh">
<h1>MEN<span>FH</span></h1>
<p class="tag">STREAMS · GAMING · COMUNIDAD</p>
</header>
<div class="rule"></div>
<p class="section-title">Encontrame acá</p>
<section class="links">
<a class="social" href="https://www.twitch.tv/menfojitofan" target="_blank" rel="noopener noreferrer"><img src="twitch.jpg" alt="Twitch de Menfh"></a>
<a class="social" href="https://www.tiktok.com/@_menfh" target="_blank" rel="noopener noreferrer"><img src="tiktok.jpg" alt="TikTok de Menfh"></a>
<a class="social" href="https://www.instagram.com/maxiavancini/?hl=es-la" target="_blank" rel="noopener noreferrer"><img src="instagram.jpg" alt="Instagram de Menfh"></a>
</section>
<p class="hint">Elegí una red para abrirla ↗</p>
<footer>MENFH · 2026</footer>
</main>
</body></html>
