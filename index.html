<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090608">
<title>Menfh | Redes</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}

:root{
  --red:#ff234b;
  --gold:#e7b657;
  --cream:#f5eee5;
  --muted:#aaa0a2;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--cream);
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:
    radial-gradient(circle at 50% -10%,rgba(151,17,42,.34),transparent 38%),
    radial-gradient(circle at 8% 55%,rgba(255,35,75,.07),transparent 25%),
    linear-gradient(180deg,#090608,#0b0709 50%,#050405);
  overflow-x:hidden;
}

/* =========================
   FONDO
========================= */

.bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}

.grid{
  position:absolute;
  inset:0;
  opacity:.08;
  background-image:
    linear-gradient(rgba(231,182,87,.15) 1px,transparent 1px),
    linear-gradient(90deg,rgba(231,182,87,.09) 1px,transparent 1px);
  background-size:55px 55px;
  mask-image:linear-gradient(to bottom,#000,transparent 90%);
}

/* =========================
   ENERGÍA / LLAMAS
========================= */

.flame{
  position:absolute;
  width:750px;
  height:120px;
  border-radius:50%;
  opacity:.32;
  filter:blur(25px);
  mix-blend-mode:screen;
}

.flame-red{
  background:
    radial-gradient(
      ellipse at center,
      rgba(255,25,55,.75) 0%,
      rgba(180,0,25,.45) 35%,
      transparent 72%
    );

  transform:rotate(-18deg);
  animation:fireMove1 11s ease-in-out infinite alternate;
}

.flame-gold{
  background:
    radial-gradient(
      ellipse at center,
      rgba(255,190,70,.55) 0%,
      rgba(255,90,20,.30) 38%,
      transparent 72%
    );

  transform:rotate(17deg);
  animation:fireMove2 13s ease-in-out infinite alternate;
}

.f1{
  top:10%;
  left:-15%;
}

.f2{
  top:38%;
  right:-22%;
}

.f3{
  top:68%;
  left:-18%;
}

.f4{
  top:82%;
  right:-18%;
}

/* líneas de energía */

.energy{
  position:absolute;
  width:900px;
  height:3px;
  border-radius:100%;
  opacity:.55;
  background:linear-gradient(
    90deg,
    transparent,
    #ff173f,
    #ff7426,
    #ffd36a,
    #ff173f,
    transparent
  );

  box-shadow:
    0 0 8px #ff173f,
    0 0 18px rgba(255,35,75,.7),
    0 0 30px rgba(255,80,20,.35);

  filter:blur(.3px);
}

.e1{
  top:22%;
  left:-20%;
  transform:rotate(-18deg);
  animation:energy1 12s ease-in-out infinite alternate;
}

.e2{
  top:55%;
  right:-30%;
  transform:rotate(14deg);
  animation:energy2 15s ease-in-out infinite alternate;
}

.e3{
  top:78%;
  left:-25%;
  transform:rotate(-12deg);
  animation:energy1 17s ease-in-out infinite alternate-reverse;
}

/* =========================
   PARTÍCULAS
========================= */

.spark{
  position:absolute;
  width:6px;
  height:6px;
  transform:rotate(45deg);
  animation:float 7s ease-in-out infinite;
  border-radius:1px;
}

.s1{
  left:7%;
  top:18%;
  background:#ff294f;
  box-shadow:0 0 12px #ff294f;
  animation-duration:6.5s;
}

.s2{
  right:8%;
  top:35%;
  background:#e7b657;
  box-shadow:0 0 12px #e7b657;
  animation-delay:-2s;
  animation-duration:8s;
}

.s3{
  left:14%;
  top:73%;
  background:#ff294f;
  box-shadow:0 0 12px #ff294f;
  animation-delay:-4s;
  animation-duration:7.2s;
}

.s4{
  right:11%;
  top:82%;
  background:#e7b657;
  box-shadow:0 0 12px #e7b657;
  animation-delay:-1s;
  animation-duration:9s;
}

.s5{
  left:3%;
  top:48%;
  background:#e7b657;
  box-shadow:0 0 14px #e7b657;
  animation-duration:10s;
}

.s6{
  right:4%;
  top:64%;
  background:#ff294f;
  box-shadow:0 0 14px #ff294f;
  animation-duration:7s;
}

/* =========================
   ANIMACIONES DEL FONDO
========================= */

@keyframes fireMove1{
  0%{
    transform:translateX(-80px) rotate(-18deg) scale(.9);
    opacity:.18;
  }
  100%{
    transform:translateX(180px) rotate(-13deg) scale(1.2);
    opacity:.42;
  }
}

@keyframes fireMove2{
  0%{
    transform:translateX(100px) rotate(17deg) scale(.9);
    opacity:.15;
  }
  100%{
    transform:translateX(-180px) rotate(12deg) scale(1.25);
    opacity:.38;
  }
}

@keyframes energy1{
  0%{
    transform:translateX(-150px) rotate(-18deg) scaleX(.7);
    opacity:.15;
  }
  100%{
    transform:translateX(250px) rotate(-12deg) scaleX(1.2);
    opacity:.65;
  }
}

@keyframes energy2{
  0%{
    transform:translateX(180px) rotate(14deg) scaleX(.8);
    opacity:.12;
  }
  100%{
    transform:translateX(-250px) rotate(9deg) scaleX(1.15);
    opacity:.55;
  }
}

@keyframes float{
  0%,100%{
    transform:translateY(0) rotate(45deg);
    opacity:.9;
  }

  50%{
    transform:translateY(-28px) rotate(135deg);
    opacity:.35;
  }
}

/* =========================
   CONTENIDO
========================= */

main{
  width:min(620px,92vw);
  margin:auto;
  padding:48px 0 72px;
  position:relative;
  z-index:2;
}

.hero{
  text-align:center;
  animation:enter .7s ease both;
}

/* =========================
   AVATAR
========================= */

.avatar{
  width:180px;
  height:180px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--gold);

  box-shadow:
    0 0 0 5px rgba(255,35,75,.08),
    0 0 42px rgba(255,35,75,.24);

  animation:dragonFloat 4.8s ease-in-out infinite;
  transition:.25s;
}

.avatar:hover{
  animation-play-state:paused;
  transform:scale(1.035) rotate(-1deg);

  box-shadow:
    0 0 0 5px rgba(231,182,87,.10),
    0 0 48px rgba(255,35,75,.34);
}

@keyframes dragonFloat{
  0%,100%{
    transform:translateY(0) rotate(0deg);
  }

  50%{
    transform:translateY(-7px) rotate(.4deg);
  }
}

/* =========================
   TITULO
========================= */

h1{
  font-family:Georgia,serif;
  font-size:42px;
  letter-spacing:6px;
  margin:17px 0 5px;
}

h1 span{
  color:var(--red);
}

.tag{
  margin:0;
  color:var(--muted);
  font-size:13px;
  letter-spacing:2.1px;
}

.rule{
  height:1px;
  margin:28px auto 30px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--gold),
      var(--red),
      var(--gold),
      transparent
    );

  box-shadow:0 0 10px rgba(255,35,75,.18);
}

/* =========================
   BOTONES
========================= */

.links{
  display:grid;
  gap:16px;
}

.social{
  display:block;
  position:relative;
  border-radius:19px;
  overflow:hidden;

  border:1px solid rgba(231,182,87,.7);

  box-shadow:
    0 12px 30px rgba(0,0,0,.32);

  transition:.25s;

  animation:enter .65s ease both;
}

.social:nth-child(2){
  animation-delay:.08s;
}

.social:nth-child(3){
  animation-delay:.16s;
}

.social img{
  display:block;
  width:100%;
  height:auto;
  transition:.35s;
}

.social:after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      105deg,
      transparent 45%,
      rgba(255,255,255,.10) 52%,
      transparent 59%
    );

  transform:translateX(-120%);
  transition:.55s;
}

.social:hover{
  transform:translateY(-4px) scale(1.008);

  border-color:#ffd982;

  box-shadow:
    0 16px 38px rgba(0,0,0,.42),
    0 0 20px rgba(255,35,75,.12);
}

.social:hover img{
  transform:scale(1.012);
}

.social:hover:after{
  transform:translateX(120%);
}

/* =========================
   ENTRADA
========================= */

@keyframes enter{
  from{
    opacity:0;
    transform:translateY(14px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:560px){

  main{
    padding-top:32px;
  }

  .avatar{
    width:150px;
    height:150px;
  }

  h1{
    font-size:34px;
  }

  .tag{
    font-size:11px;
  }

  .links{
    gap:12px;
  }

  .social{
    border-radius:14px;
  }

  .flame{
    width:500px;
    opacity:.25;
  }

  .energy{
    width:600px;
  }
}

</style>
</head>

<body>

<div class="bg">

  <div class="grid"></div>

  <!-- Llamas / energía roja -->
  <div class="flame flame-red f1"></div>
  <div class="flame flame-gold f2"></div>
  <div class="flame flame-red f3"></div>
  <div class="flame flame-gold f4"></div>

  <!-- Líneas de energía -->
  <div class="energy e1"></div>
  <div class="energy e2"></div>
  <div class="energy e3"></div>

  <!-- Partículas -->
  <i class="spark s1"></i>
  <i class="spark s2"></i>
  <i class="spark s3"></i>
  <i class="spark s4"></i>
  <i class="spark s5"></i>
  <i class="spark s6"></i>

</div>

<main>

<header class="hero">

<img
  class="avatar"
  src="avatar-menfh.jpg"
  alt="Avatar Menfh"
>

STREAMS · GAMING · COMUNIDAD
</p>

<div class="rule"></div>

<section class="links">

>
<img src="twitch.jpg" alt="Twitch de Menfh">

>

>
<img src="instagram.jpg" alt="Instagram de Menfh">

</main>

</body>
</html>
